
services:
  db:
    image: postgres:16-alpine
    container_name: brewlite-db
    restart: always
    environment:
      POSTGRES_USER: brew
      POSTGRES_PASSWORD: brewpassword123
      POSTGRES_DB: brewlite
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brew -d brewlite"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: brewlite-api
    restart: always
    environment:
      DATABASE_URL: postgresql://brew:brewpassword123@db:5432/brewlite
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: brewlite-super-secret-jwt-key-2026-production
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_USE_FIXTURES: "false"
    container_name: brewlite-web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_USE_FIXTURES: "false"
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dbdata:
